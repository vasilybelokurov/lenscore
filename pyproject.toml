[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lenscore"
version = "0.1.0"
description = "Spherical strong-lensing engine: cross-sections, image separations, time delays, optical depth"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0", "colossus>=1.3"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["lenscore"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
